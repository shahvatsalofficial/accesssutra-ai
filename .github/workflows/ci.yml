name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22'}
          - {os: ubuntu-latest, node: '24'}
          - {os: windows-latest, node: '22'}
          - {os: windows-latest, node: '24'}
          - {os: macos-latest, node: '24'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Host doctor
        run: npm run doctor
      - name: Offline demo
        run: node packages/cli/accesssutra.mjs demo --out demo-out
      - name: Assurance report (JSON + MD + HTML)
        run: node packages/cli/accesssutra.mjs audit --out audit-out
      - name: Upload assurance report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: assurance-report
          path: audit-out
          retention-days: 14
  browser:
    name: real browser (Playwright + axe-core, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install optional browser dependencies (not saved to package.json)
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Browser tests must run, not skip
        run: node --test --test-reporter=tap tests/browser.test.mjs | tee browser.tap && grep -q "^# skipped 0" browser.tap && grep -q "^# fail 0" browser.tap
  package:
    name: npm pack and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm pack --silent
      - name: Install tarball in an empty project and run through the npm bin shim
        run: |
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install ../accesssutra-ai-*.tgz
          test "$(npx accesssutra version)" = "$(node -p "require('../package.json').version")"
          npx accesssutra doctor >/dev/null
          npx accesssutra demo --out demo
          test -f demo/assessment.html && test -f demo/assessment.md && test -f demo/assessment.json
          npx accesssutra audit --out out --quiet
          test -f out/assurance-report.html && test -f out/assurance-report.md
          npx accesssutra verify --report out/assurance-report.json
          npx accesssutra install-ide --host claude --target ./proj >/dev/null
          test -f ./proj/accesssutra/skills/accesssutra-prime/SKILL.md
  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed tokens
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|npm_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!tests' ':!scripts'; then echo "Possible secret committed"; exit 1; fi
